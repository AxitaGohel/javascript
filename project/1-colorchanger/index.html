<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>1-ColorChanger</title>

    <style>
        .button{
            align-content: center;
            border: solid black 1px;
            padding-left: 50px;
            padding-top: 35px;
            margin: 10px;

        }
        #grey{
            background-color: grey;
        }
        #white{
            background-color: white;
        }
        #yellow{
            background-color:yellow;
        }
        #blue{
            background-color: blue;
        }
    </style>
</head>
<body>

    <div class="canvas">
        <h1 align="center">Color Scheme Switcher</h1>
        <span class="button" id="grey"></span>
        <span class="button" id="white"></span>
        <span class="button" id="yellow"></span>
        <span class="button" id="blue"></span>

        <h2 align="center">Try clicking on one of the colors above to change the background color of this page..!</h2>

    </div>
    <script src="pro1.js"> </script>
</body>
</html>
